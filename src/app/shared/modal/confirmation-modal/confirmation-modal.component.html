<div class="modal-container">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-title">{{ data.title }}</h4>
    <button type="button" class="close" aria-describedby="modal-title" (click)="closeModal(false)">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <p>{{ data.description }}
    </p>
  </div>
  <div class="modal-footer">
    <button mat-raised-button (click)="closeModal(false)">Inapoi</button>
    <button mat-raised-button class="btn btn-danger" (click)="actionFunction()">
      {{ data.actionButtonText }}
    </button>
  </div>
</div>
