<div class="question-main">
  <div class="question-box">
    <div class="question">
      <app-simple-question [question]="this.question" *ngIf="question.questionType === 'SIMPLE_QUESTION'"></app-simple-question>
      <app-math-question [question]="this.question" *ngIf="question.questionType === 'MATH_QUESTION'"></app-math-question>
      <app-chemistry-question [chemistryQuestion]="this.question" *ngIf="question.questionType === 'CHEMISTRY_QUESTION'"></app-chemistry-question>
    </div>

    <div class="ans">
      <div class="ans-slide" *ngFor="let answer of question.answers">
        <app-math-answer [(answer)]=answer [view_mode]=view_mode [questionStatus]=question.status *ngIf="answer.answerType === 'MATH_ANSWER'">
        </app-math-answer>
        <app-simple-answer [(answer)]=answer [view_mode]=view_mode [questionStatus]=question.status *ngIf="answer.answerType === 'SIMPLE_ANSWER'">
        </app-simple-answer>
        <app-chemistry-answer [(answer)]=answer [view_mode]=view_mode [questionStatus]=question.status *ngIf="answer.answerType === 'CHEMISTRY_ANSWER'">
        </app-chemistry-answer>
      </div>
    </div>
  </div>
</div>
