<section class="banner inner-page">
  <div [style.backgroundImage]="'url(../../../../assets/images/banner/banner-wall.jpg)'" class="banner-img">
    <img class="hidden" src="../../../../assets/images/banner/banner-wall.jpg" alt="">
  </div>
  <div class="page-title">
    <div class="container">
      <h1>Courses List</h1>
    </div>
  </div>
</section>

<section class="courses-view list-view">
  <div class="container">
    <div class="filter-row">
      <div class="search">
        <input type="text" placeholder="Search">
        <input type="submit" value="">
      </div>
    </div>
    <div *ngFor="let course of courseList">
      <div class="course-post">
        <div class="img" *ngIf="course.image">
          <img src="../../../../assets/images/banner/{{course.image}}_270.jpg" alt="">
          <div class="icon">
            <a routerLink="details/{{course.externalId}}"><img src="../../../../assets/images/book-icon.png" alt=""></a>
          </div>
          <div class="price">${{course.price}}</div>
        </div>
        <div class="info">
          <div class="name">{{course.name}}</div>
          <div class="expert"><span>By </span> {{course.author}}</div>
          <div class="product-footer">
            <div class="comment-box">
              <div class="box"><i class="fa fa-users"></i>57{{course.peopleEnroled}} Enrolled</div>
            </div>
            <div class="rating">
              <div class="fill" [ngStyle]="{width: (course.rating.average * 20) + '%'}"></div>
            </div>
            <p>{{course.description}}</p>
            <div class="view-btn2">
              <a routerLink="details/{{course.externalId}}" class="btn">view more</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
