<div class="container-fluid">
  <div class="video-container" *ngFor="let video of videosDetails">
    <div class="row">
      <div class=" col-xl-5 col-lg-5 col-md-7 col-sm-3 col-xs-5 col-9 padding-0 picture-content">
        <div class="image" (click)="changeVideo(video)">
          <div class="video-duration">{{video.videoDuration}}</div>
        </div>
      </div>
      <div class="col-xl-7 col-lg-7 col-md-5 col-sm-9 col-xs-7 col-3 details-content">
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
            <h5 class="video-title">{{video.title}}</h5>
            <div class="option-icon">
              <button mat-icon-button [matMenuTriggerFor]="topicMenu">
                <mat-icon>more_vert</mat-icon>
              </button>

              <mat-menu #topicMenu="matMenu">
                <button (click)="openUpdateVideoModel(video)" mat-menu-item>Edit</button>
                <button (click)="openDeleteVideoModal(video)" mat-menu-item>Delete</button>
              </mat-menu>
            </div>
          </div>
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
            <div class="video-description">{{video.description.substring(0, 90)}}...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
