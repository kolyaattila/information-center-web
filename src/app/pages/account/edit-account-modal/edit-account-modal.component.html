<div class="modal-container">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-title">Edit Account</h4>
    <button type="button" class="close" aria-describedby="modal-title" (click)="closeModal(false)">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form class="form-component" [formGroup]="editAccountForm">
      <mat-form-field class="form-field">
        <mat-label>Nume</mat-label>
        <input matInput placeholder="Nume Prenume" formControlName="firstName">
      </mat-form-field>
      <mat-form-field class="form-field">
        <mat-label>Prenume</mat-label>
        <input matInput placeholder="Nume Prenume" formControlName="lastName">
      </mat-form-field>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="closeModal(false)">Cancel</button>
    <button type="button" class="btn btn-success" (click)="actionFunction()" [disabled]="editAccountForm.invalid">Salveaza</button>
  </div>
</div>
