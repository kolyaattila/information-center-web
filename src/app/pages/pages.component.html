<div class="sidenav" [ngClass]="{'side-open': isOpen === true}">
  <a href="javascript:void(0)" class="closebtn" (click)="onCloseNav()">&times;</a>
  <a routerLink="/" (click)="onCloseNav()">HOME</a>
  <a routerLink="/lesson" (click)="onCloseNav()">Teorie</a>
  <a routerLink="/quiz" (click)="onCloseNav()">Quiz</a>
  <a routerLink="/examen" (click)="onCloseNav()">Simulare examen</a>
</div>

<div id="main" [ngClass]="{'side-margin': isOpen === true }">
  <div>
    <nav class="navbar p-3 px-md-4 mb-3 border-bottom bg-dark">
      <div *ngIf="!isOpen" (click)="onSwitchNav()"><i class="fas fa-bars"></i></div>
      <h4 class="my-0 mr-md-auto font-weight-normal text-white text-logo" routerLink="/">Information center</h4>
      <div class="dropdown">

        <i class="fas fa-user-circle"></i>

        <div *ngIf="currentAccount && currentAccount.username" class="dropdown-content">
          <div class="user-content" id="user-content">
            <i class="fas fa-user-circle"></i>
            <h4>{{currentAccount.username}}</h4>
          </div>
          <div class="border-top separator"></div>
          <div class="border-bottom">
            <a (click)="logout()">Logout</a>
          </div>
        </div>
      </div>
    </nav>
  </div>
  <router-outlet></router-outlet>
</div>
